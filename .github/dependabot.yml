version: 2
updates:
  # ── GitHub Actions 版本更新 ──
  # 本仓库无 npm/pip 依赖，唯一需要跟进版本的是工作流里引用的 action。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
      - "area: dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  # ── 预留：若将来引入 npm 依赖，取消下方注释 ──
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     timezone: "Asia/Shanghai"
  #   labels:
  #     - "type: chore"
  #     - "area: dependencies"
  #   commit-message:
  #     prefix: "chore"
